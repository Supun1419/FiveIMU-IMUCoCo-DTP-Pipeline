name: tests

on:
  push:
  pull_request:

jobs:
  runtime-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install numpy==1.23.5 paho-mqtt pytest
      - name: Run asset-independent tests
        run: python -m pytest -q
